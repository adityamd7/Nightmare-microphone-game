
name: Build Voice Nightmare APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle-8.9-bin.zip
          echo "$GITHUB_WORKSPACE/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Extract game ZIP
        run: |
          unzip -q VoiceNightmare_Android_Project.zip -d extracted
          test -f extracted/VoiceNightmare/app/build.gradle

      - name: Build APK
        working-directory: extracted/VoiceNightmare
        run: gradle --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: VoiceNightmare-APK
          path: extracted/VoiceNightmare/app/build/outputs/apk/debug/app-debug.apk
